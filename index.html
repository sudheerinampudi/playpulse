    if(arrs.length&&!user&&gName()&&gEmail()&&joinAsk===null)h+=`<div class="muted">Joining as <b>${esc(gName())}</b> (guest) · <button type="button" class="lnk" id="gchange">Change details</button></div>`;
    h+=`<b class="sg">Today's updates</b>`;
    h+=reps.length?`<div class="card" style="padding:2px 12px;gap:0">${reps.map((r,k)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;font-size:13.5px;${k?'border-top:1px solid var(--ring)':''}"><span><b>${esc(r.who)}</b> <span class="muted" style="font-size:12px">· ${ago(r.created_at)}</span></span><span>${r.level!=null?`<b style="color:${LV[r.level].c}">${LV[r.level].n}</b>`:`<span class="muted">${r.playing} playing · ${r.waiting} waiting</span>`}</span></div>`).join('')}</div>`:'<div class="muted">No updates yet today.</div>';
  }
  app.innerHTML=h;
  app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{prefs.sport=b.dataset.sport;savePrefs();rows=null;reps=[];arrs=[];tried=true;joinMsg='';render();load()});
  app.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{const g=grp()[Number(b.dataset.join)];if(!g)return;
    joinMsg='';if(user||(gName()&&gEmail())){doJoin(g.at,null,null)}else{joinAsk=Number(b.dataset.join);render();const n=document.getElementById('gname');if(n)n.focus()}});
  {const gj=document.getElementById('gjoin'),gc=document.getElementById('gcancel');
   {const ch=document.getElementById('gchange');if(ch)ch.onclick=()=>{try{localStorage.removeItem('cn-guest');localStorage.removeItem('cn-guest-email')}catch(e){}joinDraft={n:'',e:''};render()}}
   if(gc)gc.onclick=()=>{joinAsk=null;joinDraft={n:'',e:''};render()};
   if(gj)gj.onclick=()=>{const g=grp()[joinAsk];if(!g)return;const n=document.getElementById('gname').value.replace(/[^\p{L}\p{N}' ._-]/gu,'').trim().slice(0,20),em=document.getElementById('gemail').value.trim();joinDraft={n,e:em};
     if(n.length<2){joinMsg='Please enter a nickname (at least 2 characters).';return render()}
     if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){joinMsg='Please enter a valid email.';return render()}
     try{localStorage.setItem('cn-guest',n);localStorage.setItem('cn-guest-email',em)}catch(e){}doJoin(g.at,n,em)}}
}
async function doJoin(at,guestName,guestEmail){
  const t=new Date(at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});let name,sess=(await sb.auth.getSession()).data.session;
  if(user){const m=user.user_metadata||{};name=[m.first_name,m.last_name].filter(Boolean).join(' ')||(user.email||'').split('@')[0]}
  else{name=guestName||gName();
    if(!sess){const r=await sb.auth.signInAnonymously({options:{data:{nickname:name}}});if(r.error){joinAsk=null;joinMsg='Guest joining is not available right now ('+(r.error.message||'unknown error')+'). Please sign in with email.';return render()}}
    const em=guestEmail||gEmail();if(em){const cr=await sb.from('guest_contacts').insert({nickname:name,email:em});if(cr.error&&cr.error.code!=='23505'){joinAsk=null;joinMsg='Could not save your details: '+cr.error.message;return render()}}}
  const {error}=await sb.from('arrivals').insert({park_slug:slug,sport:prefs.sport,reporter_name:name,arriving_at:at});
  joinAsk=null;joinMsg=error?'Could not join: '+error.message:"You're joining at "+t+'. See you there!';render();if(!error)load()}
function render(){
  if(slug)return renderPark();
  let {list,all,located}=view();
  const first=list[0]?list[0].slug:(rows&&rows[0]?rows[0].slug:'border-park');
  const feat=slug?(rows||[]).find(r=>r.slug===slug):null;
  if(feat)list=list.filter(r=>r.slug!==slug);
  let h=`<div class="topbar"><div class="head"><img src="icon.png?v=4" alt="" width="40" height="40"><b class="sg" style="font-size:20px">Play Pulse</b></div>${profBtn(first)}</div>
  <div class="seg" role="group" aria-label="Sport"><button aria-pressed="${prefs.sport==='pickleball'}" data-sport="pickleball">${PB}Pickleball</button><button aria-pressed="${prefs.sport==='tennis'}" data-sport="tennis">${TN}Tennis</button></div>
  <a class="btn" href="checkin.html?park=${encodeURIComponent(first)}">Check in</a>
  <form id="zipf" class="zip"><input id="zip" inputmode="numeric" maxlength="5" placeholder="Enter ZIP code" aria-label="ZIP code" value="${esc(prefs.zip||'')}"><button class="go" type="submit">${located?'Change ZIP':'Find parks'}</button></form>
  <div class="muted"><button class="lnk" id="loc" type="button">Use my location</button>${located?' · <button class="lnk" id="clr" type="button">Show all parks</button>':''}</div>
  ${located?`<div class="chips" role="group" aria-label="Distance">${[1,2,5,10].map(r=>`<button type="button" aria-pressed="${prefs.radius===r}" data-r="${r}">${r} mi</button>`).join('')}</div>`:''}
  <div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="${prefs.view==='list'}" data-view="list">List</button><button type="button" aria-pressed="${prefs.view==='map'}" data-view="map">Map</button></div>
  ${msg?`<div class="muted" role="alert" style="color:#B3261E">${esc(msg)}</div>`:''}
  `;
  if(err)h+=`<div class="card" role="alert"><b>Couldn't load counts</b><div class="muted">${esc(err)}</div></div>`;
  else if(rows&&!list.length&&!(feat&&!located))h+=`<div class="card"><b>No ${prefs.sport} parks within ${prefs.radius} mi</b><div class="muted">${all?'Try a larger distance, or show all parks.':'No parks for this sport yet.'}</div></div>`;
  if(prefs.view==='map'){if(rows&&list.length)h+='<div id="map" class="mapbox" role="region" aria-label="Map of parks"></div>'}
  else list.forEach(r=>{const L=lvOf(r.avg_level);
    h+=`<a class="card" href="?park=${encodeURIComponent(r.slug)}"><div class="row"><b class="sg" style="font-size:16px">${esc(r.name)}</b><span class="num" style="font-size:20px;${L==null?'color:var(--muted)':'color:'+LV[L].c}">${L==null?'No data':LV[L].n}</span></div><div class="muted">${r.d!=null?r.d.toFixed(1)+' mi · ':''}${r.courts} courts · ${Number(r.report_count)?Number(r.report_count)+' report'+(r.report_count==1?'':'s')+' in the last 2 hours':'no recent reports'}</div>${Number(r.arriving_today)?`<div class="coming">${comingTxt(r.arriving_today)}</div>`:''}${L==null?'<div class="bar"><i style="width:0"></i></div>':meter(L)}</a>`});
  h+=`<div class="muted" style="text-align:center">Based on player reports from the last 2 hours. Refreshes every 30 seconds.</div>`;
  app.innerHTML=h+profSheet();wireProfile();
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{prefs.view=b.dataset.view;savePrefs();render()});
  if(prefs.view==='map'&&document.getElementById('map')&&window.L){try{
    if(window._map){window._map.remove();window._map=null}
    const m=L.map('map',{scrollWheelZoom:false});window._map=m;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
    const pts=[];
    list.filter(r=>r.lat!=null).forEach(r=>{pts.push([r.lat,r.lng]);
      L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:`<div class="mpin" style="${lvOf(r.avg_level)==null?'':'background:'+LV[lvOf(r.avg_level)].c+';color:#fff'};width:auto;padding:0 10px;white-space:nowrap">${lvOf(r.avg_level)==null?'–':LV[lvOf(r.avg_level)].n}</div>`,iconSize:[80,32],iconAnchor:[40,16]})}).addTo(m)
       .bindPopup(`<b>${esc(r.name)}</b><br>${lvOf(r.avg_level)==null?'No recent reports':LV[lvOf(r.avg_level)].n}${r.d!=null?'<br>'+r.d.toFixed(1)+' mi':''}<br><a href="?park=${encodeURIComponent(r.slug)}">View park</a>`)});
    if(located){L.circleMarker([prefs.lat,prefs.lng],{radius:8,color:'#fff',weight:3,fillColor:'#5CA8FF',fillOpacity:1}).addTo(m).bindPopup('You are here');pts.push([prefs.lat,prefs.lng])}
    if(pts.length)m.fitBounds(pts,{padding:[30,30],maxZoom:14});else m.setView([33.95,-117.6],11)}catch(e){}}
  app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{prefs.sport=b.dataset.sport;savePrefs();rows=null;render();load()});
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{prefs.radius=+b.dataset.r;savePrefs();render()});
  document.getElementById('zipf').onsubmit=async e=>{e.preventDefault();const z=document.getElementById('zip').value.trim();
    if(!/^\d{5}$/.test(z)){msg='Enter a 5-digit ZIP code.';return render()}
    try{const r=await fetch('https://api.zippopotam.us/us/'+z);if(!r.ok)throw 0;const j=await r.json();const p=j.places[0];
      prefs.zip=z;prefs.lat=parseFloat(p.latitude);prefs.lng=parseFloat(p.longitude);msg='';savePrefs()}
    catch(_){msg='Could not find that ZIP code.'}render()};
  const loc=document.getElementById('loc');if(loc)loc.onclick=()=>{if(!navigator.geolocation){msg='Location is not available in this browser.';return render()}
    navigator.geolocation.getCurrentPosition(p=>{prefs.lat=p.coords.latitude;prefs.lng=p.coords.longitude;prefs.zip='';msg='';savePrefs();render()},()=>{msg='Could not get your location. Enter a ZIP code instead.';render()})};
  const clr=document.getElementById('clr');if(clr)clr.onclick=()=>{prefs.lat=null;prefs.lng=null;prefs.zip='';savePrefs();render()};
}
render();load();setInterval(()=>{if(joinAsk===null)load()},30000);
</script></body></html>
